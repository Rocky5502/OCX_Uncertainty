llm:
  backend: zhizengzeng
  model: gpt-4o-mini
  temperature: 0.7
  max_tokens: 2048
  timeout: 180
  n_samples_for_uncertainty: 5
embedding: &embedding
  model: microsoft/unixcoder-base
  device: cpu
retrieval: &retrieval
  api_top_k: 8
  context_top_k: 8
  similar_code_top_k: 8
  fused_top_k: 10
  knowledge_uncertainty_alpha: 0.5
  uncertainty_filter_quantile: 0.7
  include_test_context: false
uncertainty: &uncertainty
  token_entropy_weight: 0.4
  self_consistency_weight: 0.4
  semantic_variance_weight: 0.2
verification: &verification
  max_repair_rounds: 2
dataset:
  name: execrepobench
  path: data/manifests/execrepobench_opencoderx_120_v1.jsonl
experiment:
  seed: 20260809
  output_dir: results/tosem/smoke/gpt4o_mini
cache_dir: cache/tosem
